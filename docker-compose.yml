services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - academy-db:/app/data
    # Host ports avoid clashes with other apps (e.g. node on :3001, other stacks on :8080).
    ports:
      - "127.0.0.1:13001:3001"

  web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://api.engleashacademy.com}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"

volumes:
  academy-db:
