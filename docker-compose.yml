services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - academy-db:/app/data
    ports:
      - "127.0.0.1:3001:3001"

  web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://api.engleashacademy.com}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

volumes:
  academy-db:
