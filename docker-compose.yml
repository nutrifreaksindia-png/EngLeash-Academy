services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - academy-db:/app/data

  web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://api.engleashacademy.com}
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  academy-db:
