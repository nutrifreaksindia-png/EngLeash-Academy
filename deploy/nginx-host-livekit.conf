# Self-hosted LiveKit — host nginx reverse proxy (WebSocket / wss).
#
# Install when LiveKit stack listens on 127.0.0.1:7880 (/opt/livekit).
#
#   sudo cp deploy/nginx-host-livekit.conf /etc/nginx/sites-available/livekit.conf
#   sudo ln -sf /etc/nginx/sites-available/livekit.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d livekit.engleashacademy.com
#   # Or extend an existing cert that covers this name.
#   sudo nginx -t && sudo systemctl reload nginx
#
# See deploy/LIVEKIT_PORT_PLAN.md for UDP/TCP firewall ports (7881, 50000-60000).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name livekit.engleashacademy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name livekit.engleashacademy.com;

    # Adjust paths to match your certbot --cert-name / -d list.
    ssl_certificate     /etc/letsencrypt/live/engleash-academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engleash-academy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/livekit.access.log;
    error_log  /var/log/nginx/livekit.error.log;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
