# TLS + HTTP→HTTPS for EngLeash (host nginx). Use AFTER certificates exist.
#
# Obtain certs first with nginx-host-engleash.conf (HTTP + ACME webroot), then:
#   sudo cp deploy/nginx-host-engleash-full.conf /etc/nginx/sites-available/engleash-academy.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert paths assume: certbot --cert-name engleash-academy -d api... -d app...
# If you used a different --cert-name or order, adjust ssl_certificate paths below.

server {
    listen 80;
    server_name api.engleashacademy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.engleashacademy.com;
    client_max_body_size 1G;

    ssl_certificate     /etc/letsencrypt/live/engleash-academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engleash-academy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}

server {
    listen 80;
    server_name app.engleashacademy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.engleashacademy.com;

    ssl_certificate     /etc/letsencrypt/live/engleash-academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engleash-academy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
